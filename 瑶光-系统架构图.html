<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>瑶光系统架构图</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
<svg viewBox="0 0 960 908" role="img" aria-label="瑶光系统架构图">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
    </marker>
  </defs>

  <!-- ===== connectors（先画线，箭头在盒子下面） ===== -->
  <path class="edge" marker-end="url(#arrow)" d="M 480 76 L 480 94" />
  <path class="edge" marker-end="url(#arrow)" d="M 190 146 L 470 178" />
  <path class="edge" marker-end="url(#arrow)" d="M 480 146 L 480 178" />
  <path class="edge" marker-end="url(#arrow)" d="M 770 146 L 490 178" />
  <path class="edge" marker-end="url(#arrow)" d="M 480 244 L 480 276" />
  <path class="edge" marker-end="url(#arrow)" d="M 480 354 L 480 386" />
  <path class="edge" marker-end="url(#arrow)" d="M 480 516 L 480 558" />
  <path class="edge" marker-end="url(#arrow)" d="M 480 636 L 480 664" />
  <path class="edge" marker-end="url(#arrow)" d="M 480 742 L 480 770" />

  <!-- ===== 1. 先生 ===== -->
  <rect class="node external" x="380" y="20" width="200" height="56" rx="10" />
  <text class="label" x="480" y="45" text-anchor="middle">贾先生（你）</text>
  <text class="small" x="480" y="64" text-anchor="middle">对话 · 指令 · 决策</text>

  <!-- ===== 2. 接入层 ===== -->
  <rect class="node input" x="90" y="96" width="200" height="50" rx="8" />
  <text class="label" x="190" y="126" text-anchor="middle">WebChat</text>
  <rect class="node input" x="380" y="96" width="200" height="50" rx="8" />
  <text class="label" x="480" y="126" text-anchor="middle">飞书 Feishu</text>
  <rect class="node input" x="670" y="96" width="200" height="50" rx="8" />
  <text class="label" x="770" y="126" text-anchor="middle">Control UI</text>

  <!-- ===== 3. Gateway ===== -->
  <rect class="node process" x="140" y="180" width="680" height="64" rx="10" />
  <text class="label" x="480" y="205" text-anchor="middle">OpenClaw Gateway · 框架核心（v2026.7.1）</text>
  <text class="small" x="480" y="228" text-anchor="middle">会话路由 · 通道接入 · cron 调度 · 配置热更新 · 安全策略</text>

  <!-- ===== 4. 大脑 ===== -->
  <rect class="node process" x="140" y="278" width="680" height="76" rx="10" />
  <text class="label" x="480" y="305" text-anchor="middle">瑶光核心 Agent（main）</text>
  <text class="small" x="480" y="328" text-anchor="middle">DeepSeek V4 Flash · 100万token上下文 · 子代理池（MiniMax-M3 / DeepSeek 等）</text>

  <!-- ===== 5. 工具层 ===== -->
  <rect class="node process" x="90" y="388" width="200" height="56" rx="8" />
  <text class="label" x="190" y="412" text-anchor="middle">exec 终端 / 文件</text>
  <text class="small" x="190" y="432" text-anchor="middle">跑脚本 · 运维 · 批处理</text>
  <rect class="node process" x="380" y="388" width="200" height="56" rx="8" />
  <text class="label" x="480" y="412" text-anchor="middle">Web 搜索 / 抓取</text>
  <text class="small" x="480" y="432" text-anchor="middle">查资料 · 核实信息</text>
  <rect class="node process" x="670" y="388" width="200" height="56" rx="8" />
  <text class="label" x="770" y="412" text-anchor="middle">飞书套件</text>
  <text class="small" x="770" y="432" text-anchor="middle">文档 · 表格 · 云盘 · 知识库</text>
  <rect class="node process" x="90" y="460" width="200" height="56" rx="8" />
  <text class="label" x="190" y="484" text-anchor="middle">cron 定时 / 提醒</text>
  <text class="small" x="190" y="504" text-anchor="middle">9个常驻自动化任务</text>
  <rect class="node process" x="380" y="460" width="200" height="56" rx="8" />
  <text class="label" x="480" y="484" text-anchor="middle">媒体生成 / 分析</text>
  <text class="small" x="480" y="504" text-anchor="middle">图像 · 视频 · TTS · PDF</text>
  <rect class="node process" x="670" y="460" width="200" height="56" rx="8" />
  <text class="label" x="770" y="484" text-anchor="middle">节点设备</text>
  <text class="small" x="770" y="504" text-anchor="middle">手机/桌面 · 截图通知</text>

  <!-- ===== 6. 记忆层 ===== -->
  <rect class="node storage" x="140" y="560" width="680" height="76" rx="10" />
  <text class="label" x="480" y="587" text-anchor="middle">记忆系统 · 四层架构（人格连续性）</text>
  <text class="small" x="480" y="610" text-anchor="middle">MEMORY.md · long-term/ · memory/每日日志 · DREAMS.md · transcripts · git备份</text>

  <!-- ===== 7. 治理层 ===== -->
  <rect class="node neutral" x="140" y="666" width="680" height="76" rx="10" />
  <text class="label" x="480" y="693" text-anchor="middle">协作与治理体系 · 12 条纪律</text>
  <text class="small" x="480" y="716" text-anchor="middle">governance/ · handoff/ · reflections/ · findings/ · PROJECT_MAP · VERSION_LEDGER · DECISION_LOG</text>

  <!-- ===== 8. 自动化层 ===== -->
  <rect class="node storage" x="140" y="772" width="680" height="64" rx="10" />
  <text class="label" x="480" y="797" text-anchor="middle">9 个 cron 自动化任务（后台常驻）</text>
  <text class="small" x="480" y="820" text-anchor="middle">每日备份×2 · 健康检查 · Memory Dreaming · L2一致性 · 安全更新 · 周报 · 日志清理</text>

  <!-- ===== 图例 ===== -->
  <rect x="150" y="866" width="16" height="16" rx="3" class="input node" />
  <text class="small" x="172" y="879">接入通道</text>
  <rect x="290" y="866" width="16" height="16" rx="3" class="process node" />
  <text class="small" x="312" y="879">核心处理</text>
  <rect x="430" y="866" width="16" height="16" rx="3" class="storage node" />
  <text class="small" x="452" y="879">记忆/存储</text>
  <rect x="570" y="866" width="16" height="16" rx="3" class="neutral node" />
  <text class="small" x="592" y="879">规则/治理</text>
  <rect x="710" y="866" width="16" height="16" rx="3" class="external node" />
  <text class="small" x="732" y="879">你/外部</text>
</svg>
</main>
